# Render Blueprint for the public demo (free web service + an external Neon Postgres).
# See docs/demo.md. Secrets (DATABASE_URL, ENCRYPTION_KEYS) are entered in the dashboard.
services:
  - type: web
    name: shortlist-demo
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    # Free instances have no pre-deploy step: migrate and (re)seed the fictional data on every
    # start, which also refreshes the demo's dates each time it wakes up.
    dockerCommand: sh -c "node apps/api/dist/scripts/migrate.js && node apps/api/dist/scripts/demo-seed.js && exec node apps/api/dist/server.js"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: SIGNUP_MODE
        value: closed
      - key: TRUST_PROXY
        value: "1"
      - key: FEATURE_EMAIL_INTAKE
        value: "false"
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEYS
        sync: false
      - key: ENCRYPTION_ACTIVE_KEY_ID
        value: demo
